apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traverse.fullname" . | default "traverse" }}
  labels:
    app: traverse
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: traverse
  template:
    metadata:
      labels:
        app: traverse
    spec:
      {{- with .Values.serviceAccount }}
      {{- if .create }}
      serviceAccountName: {{ .name | default "traverse" }}
      {{- end }}
      {{- end }}
      {{- if eq .Values.storage.kind "file" }}
      volumes:
      - name: data
        emptyDir: {}
      {{- end }}
      containers:
      - name: traverse
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        env:
        - name: RUST_LOG
          value: {{ .Values.env.RUST_LOG | quote }}
        - name: PORT
          value: {{ .Values.service.port | quote }}
        - name: STORAGE
          value: {{ .Values.storage.kind | quote }}
        - name: STORAGE_DIR
          value: {{ .Values.storage.dir | quote }}
        {{- if .Values.storage.s3.bucket }}
        - name: S3_BUCKET
          value: {{ .Values.storage.s3.bucket | quote }}
        - name: S3_PREFIX
          value: {{ .Values.storage.s3.prefix | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.s3.region | quote }}
        {{- end }}
        {{- if .Values.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        {{- if .Values.otel.headers }}
        - name: OTEL_EXPORTER_OTLP_HEADERS
          value: {{ .Values.otel.headers | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.billing.enabled }}
        - name: BILLING_COST_PER_1K
          value: {{ .Values.billing.costPer1k | quote }}
        {{- end }}
        {{- if .Values.auth.token }}
        - name: CONTROL_PLANE_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "traverse.fullname" . }}
              key: control-plane-token
        {{- else if .Values.auth.tokens }}
        - name: CONTROL_PLANE_TOKENS
          valueFrom:
            secretKeyRef:
              name: {{ include "traverse.fullname" . }}
              key: control-plane-tokens
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: {{ .Values.probes.readiness.port }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        {{- if eq .Values.storage.kind "file" }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.storage.dir | quote }}
        {{- end }}
